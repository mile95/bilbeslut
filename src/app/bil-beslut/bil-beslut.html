<div class="relative flex flex-col gap-y-4 h-screen w-screen items-center justify-center">

    <app-header></app-header>

    <!-- Loading overlay -->
    @if (loading()) {
    <div class="absolute inset-0 z-10 flex items-center justify-center bg-white/70 backdrop-blur-sm">
        <div class="flex items-center gap-3 text-gray-600">
            <svg class="animate-spin h-5 w-5 text-blue-600" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
            </svg>
            <span class="font-medium">Hämtar alternativ…</span>
        </div>
    </div>
    }

    <app-result-filter class="w-full flex items-center justify-center" [brands]="allUniqueBrands()"
        (filterChange)="handleFilterChange($event)">
    </app-result-filter>

    <!-- Inga resultat -->
    @if (!loading() && filteredResults().length === 0) {
    <div class="flex flex-col items-center justify-center flex-1 text-gray-500 gap-2">
        <span class="text-lg font-medium">
            Inga resultat matchar ditt filter
        </span>
        <span class="text-sm">
            Testa att justera dina val eller rensa filtret
        </span>
    </div>
    } @else {
    <!-- Resultat -->
    <div class="grid grid-cols-4 gap-4 p-4 overflow-y-auto flex-1">
        @for (r of filteredResults(); track r.sourceUrl) {
        <app-private-leasing-result [privateLeasing]="r">
        </app-private-leasing-result>
        }
    </div>
    }
</div>
